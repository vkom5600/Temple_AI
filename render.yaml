# One-click hosting on Render (render.com → New → Blueprint → pick this repo).
# One web service runs the API and serves the website; one Postgres database.
# Region: Frankfurt (closest to the UK). See docs/DEPLOY.md before using it for real.
services:
  - type: web
    name: temple-ai
    runtime: node
    region: frankfurt
    plan: starter            # 'free' works for a demo but sleeps when idle
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm run db:migrate && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: temple-ai-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: TEMPLE_TIMEZONE
        value: Europe/London
      # Set these in the Render dashboard (never commit them):
      - key: FRONTEND_URL          # the site's web address, e.g. https://temple-ai.onrender.com
        sync: false
      - key: INITIAL_CHAIRMAN_NAME
        sync: false
      - key: INITIAL_CHAIRMAN_EMAIL
        sync: false
      - key: INITIAL_CHAIRMAN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY     # optional: switches on Temple AI (Claude)
        sync: false
      - key: SMTP_HOST             # optional: real emails (otherwise they're only logged)
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: temple-ai-db
    region: frankfurt
    plan: basic-256mb
